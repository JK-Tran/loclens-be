name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-lint:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20" # Sử dụng Node.js bản LTS ổn định nhất
          cache: "npm" # Cache lại node_modules để chạy nhanh hơn ở các lần sau

      - name: 📦 Install Dependencies
        run: npm ci --legacy-peer-deps # Dùng npm ci thay vì npm install để cài đặt chính xác các versions trong package-lock.json

      - name: 🗄️ Generate Prisma Client
        run: npx prisma generate

      - name: 🧹 Run Linting (Oxlint)
        run: npm run lint

      - name: 🧪 Run Unit Tests (Vitest)
        run: npm run test

      - name: 🏗️ Run Build (Check compilation)
        run: npm run build
